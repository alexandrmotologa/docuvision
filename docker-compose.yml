version: "3.8"

services:
  docuvision:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docuvision-studio
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DOCUVISION_VLM_BASE_URL=http://ollama:11434/v1
      - DOCUVISION_VLM_MODEL=llama3.2-vision:latest
      - DOCUVISION_VLM_PROVIDER=ollama
      - DOCUVISION_RASTER_DPI=200
    volumes:
      - docuvision_data:/home/docuvision/.docuvision
      - ./outputs:/app/outputs
      - ./examples:/app/examples:ro
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: docuvision-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  docuvision_data:
  ollama_models:
